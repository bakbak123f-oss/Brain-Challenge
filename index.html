
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Challenge</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="game">
        <h1> Brain Challenge</h1>
        <p>Test je hersenen met een puzzel!</p>

        <h2 id="question">Hoeveel is 5 + 3?</h2>

        <input type="number" id="answer" placeholder="Jouw antwoord">

        <button id="checkButton">Controleer antwoord</button>

        <p id="feedback">Vul je antwoord in.</p>
        <p id="score">Score: 0</p>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
